plugins {
    id 'com.android.application'
}
android {
    namespace 'vn.hoicholab.offline'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.hoicholab.offline'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
